  <body>
    <!-- Same blue as the welcome screen, so there is no white flash while the app downloads -->
    <div id="boot" style="position:fixed;inset:0;z-index:99998;background:#1A5276"></div>
    <script>
      try {
        if (sessionStorage.getItem('ah_splash_seen') && !/[?&]splash/.test(location.search)) {
          document.getElementById('boot').remove();
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
