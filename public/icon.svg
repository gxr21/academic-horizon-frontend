      <stop offset="0" stop-color="#1F6391"/>
      <stop offset="1" stop-color="#123B55"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D391"/>
      <stop offset="1" stop-color="#E9C176"/>
